<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Management | Legal Risk Analyzer</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/assets/css/app.css">
  <link rel="stylesheet" href="/assets/css/themes.css">
  <script>
    (function() {
      const t = new URLSearchParams(window.location.search).get('theme') || localStorage.getItem('app_theme') || 'claymorphism';
      document.documentElement.setAttribute('data-theme', t);
      localStorage.setItem('app_theme', t);
    })();
  </script>
</head>
<body class="d-flex flex-column min-vh-100">
  <!-- Dynamic Floating Navbar -->
  <div id="navbarPlaceholder"></div>

  <!-- Main Content -->
  <main class="main-content container-fluid px-4 py-4">
    <!-- Header Hero Card -->
    <div class="clay-card p-4 mb-4">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
        <div class="d-flex align-items-center gap-3">
          <div class="clay-icon-sphere primary fs-3">
            <i class="bi bi-people"></i>
          </div>
          <div>
            <h3 class="fw-bold text-dark mb-1">User & Role Management</h3>
            <p class="text-secondary mb-0">Provision and manage internal enterprise users, assign role permissions, and toggle account access.</p>
          </div>
        </div>
        <div>
          <button class="btn btn-primary px-4 py-2" data-bs-toggle="modal" data-bs-target="#userModal">
            <i class="bi bi-person-plus me-1"></i>Create New User
          </button>
        </div>
      </div>
    </div>

    <!-- Users Table Card -->
    <div class="clay-card p-4">
      <div class="table-responsive">
        <table class="clay-table align-middle">
          <thead>
            <tr>
              <th>User Name & Email</th>
              <th>System Role</th>
              <th>Account Status</th>
              <th>Account Created</th>
              <th>Last Active</th>
              <th class="text-end">Manage</th>
            </tr>
          </thead>
          <tbody id="usersTableBody">
            <tr>
              <td colspan="6" class="text-center py-5 text-muted">
                <div class="spinner-border spinner-border-sm text-primary me-2"></div>
                Loading users...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Create/Edit User Modal -->
  <div class="modal fade" id="userModal" tabindex="-1" aria-labelledby="userModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <form id="userForm">
          <div class="modal-header">
            <h5 class="modal-title fw-bold text-dark" id="userModalLabel">Create User Account</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="editUserId">
            <div class="mb-3">
              <label for="userNameInput" class="form-label small fw-bold text-secondary">FULL NAME</label>
              <input type="text" class="form-control" id="userNameInput" placeholder="Jane Doe" required>
            </div>
            <div class="mb-3">
              <label for="userEmailInput" class="form-label small fw-bold text-secondary">EMAIL ADDRESS</label>
              <input type="email" class="form-control" id="userEmailInput" placeholder="name@company.com" required>
            </div>
            <div class="mb-3" id="passwordGroup">
              <label for="userPasswordInput" class="form-label small fw-bold text-secondary">PASSWORD (MIN 6 CHARS)</label>
              <input type="password" class="form-control" id="userPasswordInput" placeholder="••••••••">
            </div>
            <div class="mb-3">
              <label for="userRoleSelect" class="form-label small fw-bold text-secondary">ROLE</label>
              <select class="form-select" id="userRoleSelect" required>
                <option value="associate">Legal Associate</option>
                <option value="partner">Legal Partner</option>
                <option value="admin">System Admin</option>
              </select>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" id="saveUserBtn" class="btn btn-primary fw-bold px-4">Save User</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Reset Password Modal -->
  <div class="modal fade" id="resetPasswordModal" tabindex="-1" aria-labelledby="resetModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <form id="resetPasswordForm">
          <div class="modal-header">
            <h5 class="modal-title fw-bold text-dark" id="resetModalLabel">Reset User Password</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="resetUserId">
            <p class="small text-muted">Set a new password for <strong id="resetUserName" class="text-dark">--</strong>.</p>
            <div class="mb-3">
              <label for="newPasswordInput" class="form-label small fw-bold text-secondary">NEW PASSWORD (MIN 6 CHARS)</label>
              <input type="password" class="form-control" id="newPasswordInput" placeholder="••••••••" required minlength="6">
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-danger fw-bold px-4">Confirm Reset</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/assets/js/themeSwitcher.js"></script>
  <script type="module" src="/assets/js/pages/adminUsers.js"></script>
</body>
</html>
