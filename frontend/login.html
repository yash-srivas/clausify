<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Legal Contract & Vendor Risk Analyzer</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/assets/css/app.css">
  <link rel="stylesheet" href="/assets/css/themes.css">
  <script>
    (function() {
      const t = new URLSearchParams(window.location.search).get('theme') || localStorage.getItem('app_theme') || 'claymorphism';
      document.documentElement.setAttribute('data-theme', t);
      localStorage.setItem('app_theme', t);
    })();
  </script>
</head>
<body class="d-flex align-items-center justify-content-center py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-5">

        <!-- App Brand Header -->
        <div class="text-center mb-4">
          <div class="d-inline-flex p-3 rounded-circle clay-card-flat mb-3" style="font-size: 2.5rem; background: #FFFFFF;">
            <i class="bi bi-shield-shaded text-primary"></i>
          </div>
          <h2 class="fw-bold text-dark mb-1">Legal Risk Analyzer</h2>
          <p class="text-secondary small">Smart AI contract review made simple for everyone.</p>
        </div>

        <!-- Notification Alert -->
        <div id="alertBox" class="alert alert-danger d-none clay-card-flat py-2 px-3 small border-0 mb-3" role="alert"></div>

        <!-- 1-Click Fast Demo Logins -->
        <div class="clay-card p-4 mb-4">
          <div class="d-flex align-items-center justify-content-between mb-3">
            <h6 class="fw-bold text-dark mb-0"><i class="bi bi-lightning-charge-fill text-warning me-1"></i> 1-Click Instant Demo Access</h6>
            <span class="badge bg-light text-secondary border">No typing required</span>
          </div>

          <div class="d-grid gap-2">
            <!-- Associate -->
            <button type="button" class="demo-role-card d-flex align-items-center text-start border-0 demo-btn" data-email="associate@demo.com" data-password="Demo@123">
              <div class="p-2 rounded-circle bg-primary-subtle text-primary me-3 fs-5">
                <i class="bi bi-file-earmark-person"></i>
              </div>
              <div class="flex-grow-1">
                <div class="fw-bold text-dark">Legal Associate</div>
                <div class="text-secondary small">Upload contracts, review AI flags & PDF highlights</div>
              </div>
              <i class="bi bi-arrow-right-circle text-primary fs-5"></i>
            </button>

            <!-- Partner -->
            <button type="button" class="demo-role-card d-flex align-items-center text-start border-0 demo-btn" data-email="partner@demo.com" data-password="Demo@123">
              <div class="p-2 rounded-circle bg-success-subtle text-success me-3 fs-5">
                <i class="bi bi-award"></i>
              </div>
              <div class="flex-grow-1">
                <div class="fw-bold text-dark">Legal Partner</div>
                <div class="text-secondary small">Approve escalated contracts & edit safe templates</div>
              </div>
              <i class="bi bi-arrow-right-circle text-success fs-5"></i>
            </button>

            <!-- Admin -->
            <button type="button" class="demo-role-card d-flex align-items-center text-start border-0 demo-btn" data-email="admin@demo.com" data-password="Demo@123">
              <div class="p-2 rounded-circle bg-danger-subtle text-danger me-3 fs-5">
                <i class="bi bi-shield-lock"></i>
              </div>
              <div class="flex-grow-1">
                <div class="fw-bold text-dark">System Admin</div>
                <div class="text-secondary small">Executive analytics, user roles & audit logs</div>
              </div>
              <i class="bi bi-arrow-right-circle text-danger fs-5"></i>
            </button>
          </div>
        </div>

        <!-- Manual Sign In Accordion / Card -->
        <div class="clay-card p-4">
          <div class="text-center mb-3">
            <span class="text-muted small fw-semibold text-uppercase">Or Sign In with Email</span>
          </div>

          <form id="loginForm" novalidate>
            <div class="mb-3">
              <label for="emailInput" class="form-label text-muted small fw-semibold">EMAIL</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                <input
                  type="email"
                  class="form-control"
                  id="emailInput"
                  placeholder="name@company.com"
                  required
                >
              </div>
            </div>

            <div class="mb-4">
              <label for="passwordInput" class="form-label text-muted small fw-semibold">PASSWORD</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input
                  type="password"
                  class="form-control"
                  id="passwordInput"
                  placeholder="••••••••"
                  required
                >
              </div>
            </div>

            <button type="submit" id="submitBtn" class="btn btn-primary w-100 py-3 fw-bold">
              <span id="btnSpinner" class="spinner-border spinner-border-sm me-2 d-none" role="status"></span>
              <span id="btnText">Sign In to Workspace</span>
            </button>
          </form>
        </div>

        <p class="text-center text-muted small mt-4 mb-0">
          Intelligent Legal Contract & Vendor Risk Analyzer &bull; 2026
        </p>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/assets/js/themeSwitcher.js"></script>
  <script type="module" src="/assets/js/pages/login.js"></script>
</body>
</html>
