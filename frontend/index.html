<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Legal Risk Analyzer - Redirecting...</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">
  <div class="text-center">
    <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
      <span class="visually-hidden">Loading...</span>
    </div>
    <p class="mt-3 text-muted">Redirecting to workspace...</p>
  </div>

  <script type="module">
    import { isLoggedIn, getUser, getDefaultRedirectForRole } from '/assets/js/auth.js';

    if (isLoggedIn()) {
      const user = getUser();
      window.location.replace(getDefaultRedirectForRole(user ? user.role : 'associate'));
    } else {
      window.location.replace('/login.html');
    }
  </script>
</body>
</html>
